<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>開始復健 | IRS 2.0</title><link rel="stylesheet" href="style.css?v=2.5"></head><body><main class="shell"><header class="topbar"><a class="brand" href="index.html">IRS</a><nav class="nav" aria-label="主要導覽"><a href="index.html">首頁</a><a href="start.html">開始復健</a><a href="record.html">復健紀錄</a></nav><div class="account"><span data-user-email></span><button class="btn logout" data-logout>登出</button></div></header><div class="split"><div><div class="eyebrow">Training Simulation</div><h1>復健訓練</h1></div><span id="stateBadge" class="pill warn" role="status">待機中</span></div><section class="grid2"><div class="card"><div class="split"><h2>訓練設定</h2></div><div class="field"><label for="target">目標循環次數（每次包含八個方向）</label><input id="target" type="number" min="1" max="100" value="12"></div><div class="field"><label for="speed">模擬速度</label><select id="speed"><option value="2000">慢速（每方向 2 秒）</option><option value="1200" selected>一般（每方向 1.2 秒）</option><option value="700">快速（每方向 0.7 秒）</option></select></div><div class="actions"><button id="startBtn" class="btn primary">開始模擬</button><button id="pauseBtn" class="btn" disabled>暫停</button><button id="stopBtn" class="btn danger" disabled>結束並儲存</button></div><p class="muted" id="message" aria-live="polite">設定目標後按開始。</p></div><div class="card"><div class="statusline"><h2 id="title">Ready?</h2><span class="pill" id="phase">READY</span></div><div class="plane-demo" aria-label="俯視圖：復健手滑車依序朝八個方向移動">
  <div class="plane-board" id="planeBoard">
    <svg class="plane-guides" viewBox="0 0 320 320" aria-hidden="true">
      <circle cx="160" cy="160" r="108" fill="none" stroke="#dbe4ef" stroke-width="1.5" stroke-dasharray="5 7"/>
      <g stroke="#cbd5e1" stroke-width="2" stroke-linecap="round">
        <line x1="160" y1="160" x2="160" y2="52"/><line x1="160" y1="160" x2="236.4" y2="83.6"/>
        <line x1="160" y1="160" x2="268" y2="160"/><line x1="160" y1="160" x2="236.4" y2="236.4"/>
        <line x1="160" y1="160" x2="160" y2="268"/><line x1="160" y1="160" x2="83.6" y2="236.4"/>
        <line x1="160" y1="160" x2="52" y2="160"/><line x1="160" y1="160" x2="83.6" y2="83.6"/>
      </g>
      <circle cx="160" cy="160" r="5" fill="#94a3b8"/>
    </svg>
    <span class="plane-label" style="--x:50%;--y:8%">上</span>
    <span class="plane-label" style="--x:83%;--y:17%">右上</span>
    <span class="plane-label" style="--x:94%;--y:50%">右</span>
    <span class="plane-label" style="--x:83%;--y:83%">右下</span>
    <span class="plane-label" style="--x:50%;--y:94%">下</span>
    <span class="plane-label" style="--x:17%;--y:83%">左下</span>
    <span class="plane-label" style="--x:6%;--y:50%">左</span>
    <span class="plane-label" style="--x:17%;--y:17%">左上</span>
    <div class="plane-cart" id="sliderCart" aria-hidden="true"><div class="plane-cart-grip"></div><div class="plane-cart-body">IRS</div><div class="plane-cart-base"></div></div>
  </div>
  <div class="plane-info"><span id="direction">目前方向：待機</span><strong id="counter">0 / 12</strong></div>
  <p class="slider-hint" id="countdown">準備開始</p>
</div><div class="split"><span>模擬完成進度</span><strong id="percent">0%</strong></div><div class="bar"><div id="progress"></div></div></div></section><h2 class="section-title">操作紀錄</h2><div class="card"><div class="log" id="eventLog" aria-live="polite">尚無操作</div></div><p class="simple-footnote">模擬模式 · 不控制實體設備</p></main><script type="module" src="auth.js?v=2.5"></script></body></html>
