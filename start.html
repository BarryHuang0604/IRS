<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>開始復健 | IRS 2.0</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header class="topbar"><a class="brand" href="index.html">IRS <span>2.0</span></a><nav class="nav" aria-label="主要導覽"><a href="index.html">總覽</a><a class="active" href="start.html">開始復健</a><a href="record.html">復健紀錄</a></nav><div class="account"><span data-user-email>驗證中</span><button class="btn logout" data-logout>登出</button></div></header><div class="split"><div><div class="eyebrow">Training Simulation</div><h1>復健訓練模擬</h1><p class="muted">原版 5 秒倒數 + 8 LED 顯示，升級為完整模擬訓練流程。</p></div><span id="stateBadge" class="pill warn" role="status">待機中</span></div><section class="grid2"><div class="card"><div class="split"><h2>訓練設定</h2><span class="pill">無硬體連線</span></div><div class="field"><label for="target">目標循環次數（1–100）</label><input id="target" type="number" min="1" max="100" value="12"></div><div class="field"><label for="speed">模擬速度</label><select id="speed"><option value="2000">慢速（每 2 秒 1 次）</option><option value="1200" selected>一般（每 1.2 秒 1 次）</option><option value="700">快速（每 0.7 秒 1 次）</option></select></div><div class="actions"><button id="startBtn" class="btn primary">開始模擬</button><button id="pauseBtn" class="btn" disabled>暫停</button><button id="stopBtn" class="btn danger" disabled>結束並儲存</button></div><p class="muted" id="message" aria-live="polite">設定目標後即可開始。這些參數只影響動畫，不會控制馬達。</p><div class="note">🛡️ 安全說明：本頁所有控制都只改變瀏覽器畫面，不會發送任何 ESP32 控制指令。</div></div><div class="card"><div class="statusline"><h2 id="title">Ready?</h2><span class="pill" id="phase">READY</span></div><div class="led-ring" id="ledRing"><div class="center-label"><strong id="counter">0 / 12</strong><small id="countdown">準備開始</small></div></div><div class="split"><span>模擬完成進度</span><strong id="percent">0%</strong></div><div class="bar"><div id="progress"></div></div><div class="split"><span class="muted">目前 LED 位置</span><strong id="ledLabel">—</strong></div></div></section><h2 class="section-title">操作事件紀錄</h2><div class="card"><div class="log" id="eventLog" aria-live="polite">尚無操作</div></div><footer class="footer">IRS 2.0 · 本頁不會連接實體復健車</footer></main><script type="module" src="auth.js"></script></body></html>
