<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>復健紀錄 | IRS 2.0</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header class="topbar"><a class="brand" href="index.html">IRS</a><nav class="nav" aria-label="主要導覽"><a href="index.html">首頁</a><a href="start.html">開始復健</a><a href="record.html">復健紀錄</a></nav><div class="account"><span data-user-email></span><button class="btn logout" data-logout>登出</button></div></header><div class="split"><div><div class="eyebrow">Training History</div><h1>復健紀錄分析</h1></div><div class="actions"><button id="exportBtn" class="btn primary">匯出 CSV</button><button id="clearBtn" class="btn danger">清除本機紀錄</button></div></div><section class="stats"><div class="card stat"><small>訓練次數</small><strong id="total">0</strong></div><div class="card stat"><small>累積循環</small><strong id="cycles">0</strong></div><div class="card stat"><small>平均完成率</small><strong id="average">0%</strong></div></section><section class="grid2"><div class="card"><h2>最近 10 次完成率</h2><div id="chart" class="chart" role="img" aria-label="最近 10 次訓練完成率長條圖"></div><p class="muted" id="chartCaption">尚無資料</p></div></section><h2 class="section-title">歷史訓練明細</h2><div class="card table-wrap"><table><thead><tr><th>日期時間</th><th>目標</th><th>完成</th><th>完成率</th><th>耗時</th><th>結果</th></tr></thead><tbody id="records"></tbody></table><p id="empty" class="empty">目前沒有模擬紀錄，先去開始一場訓練吧！</p></div><h2 class="section-title">操作紀錄</h2><div class="card log" id="events"></div><p class="simple-footnote">展示模式 · 紀錄儲存在本機瀏覽器</p></main><script type="module" src="auth.js"></script></body></html>
